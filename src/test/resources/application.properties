spring.application.name=fire-shield-localidades-ms

# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cria/destrói o schema automaticamente nos testes
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway desabilitado em testes
spring.flyway.enabled=false

# H2 console (opcional para debug de testes)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Feign stub
spring.cloud.openfeign.client.config.localidade-api.url=http://localhost:9999

# RabbitMQ desabilitado em testes
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
spring.rabbitmq.ssl.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.simple.missing-queues-fatal=false

spring.docker.compose.enabled=false

RABBITMQ_QUEUE_DESTINY=loc.ocorrencia.queue
RABBITMQ_QUEUE_ORIGIN=fs.ocorrencia.queue
DB_URL=jdbc:h2:mem:testdb
DB_USER=sa
DB_PASSWORD=
API_URL=http://localhost:9999

