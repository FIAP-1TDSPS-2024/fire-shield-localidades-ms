spring.application.name=fire-shield-localidades-ms
server.port=8080

#Database
spring.profiles.active=prod
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console do H2 para inspecionar a tabela ocorrencias
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.springframework.security=TRACE
logging.level.br.com.fiap.projectmgtmvc=TRACE

# Feign Client Configuration
spring.cloud.openfeign.client.config.localidade-api.url=${API_URL}
spring.cloud.openfeign.client.config.default.default-request-headers.accept=application/json
spring.cloud.openfeign.client.config.default.default-request-headers.user-agent=jonas.joliveira2024@gmail.com
spring.cloud.openfeign.client.config.default.connect-timeout=30000
spring.cloud.openfeign.client.config.default.read-timeout=30000
spring.cloud.openfeign.client.config.default.logger-level=basic

spring.jackson.property-naming-strategy= SNAKE_CASE

# RabbitMQ CloudAMQP
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.ssl.enabled=true

spring.rabbitmq.listener.simple.missing-queues-fatal=false

spring.docker.compose.enabled=false
